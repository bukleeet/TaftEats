<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>
    <link rel="stylesheet" href="public/css/style.css">
    <link rel="stylesheet" href="public/css/register-page-style.css">
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="nav-left">
        <h2 class="logo">TaftEats</h2>
    </div>
    <div class="nav-right">
        <a href="views/establishments.ejs" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="views/reviews.ejs" class="nav-link">Reviews</a>
        <a href="profile-view.html" class="nav-link">Profile</a>
        <a href="login.html" class="nav-btn login">Login</a>
        <a href="register.html" class="nav-btn register">Register</a>
        <button id="themeToggle" class="theme-btn">🌙</button>
    </div>
</nav>

<!-- Main Account Creation Page -->
<main class="container register-container">
    <!-- Register Card -->
    <div class="register-card">
        <div class="register-header"> 
            <h2>Greetings!</h2>
            <p>Create an Account by entering your details.</p>
        </div>

        <!-- Registration Form -->
        <form id="registerForm">
                <!-- Username Input -->
                <div class="input-box">
                    <label for="username" class="register-label">Username</label>
                    <input type="text" id="username" class="register-input" placeholder="Enter your username" required>
                </div>

                <!-- Email Input -->
                <div class="input-box">
                    <label for="userEmail" class="register-label">Email</label>
                    <input type="email" id="userEmail" class="register-input" placeholder="user@email.com" required>
                </div>

                <!-- Password Input -->
                <div class="input-box">
                    <label for="userPassword" class="register-label">Password</label>
                    <input type="password" id="userPassword" class="register-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="sign-up-btn" onclick="event.preventDefault() ;openModal('profileModal')">Sign up</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>
</main>

<!-- Modal for Entering Profile Avatar & Desc -->
<div class="modal" id="profileModal">
    <form id="profileForm" class="min-height: 80vh">
        <div class="modal-card">
        <h2>Complete Your Profile Creation</h2>

        <!-- Profile Avatar Upload -->
        <div class="media-upload">
            <label for="profileImage" class="upload-label">Attach Photo</label>
            <input type="file" id="profileImage" accept="image/*" style="display:none;" onchange="previewImage(this)">

            <!-- Image Preview -->
            <div id="imagePreviewContainer" style="display:none; margin-top:10px;">
                <img id="imagePreview" src="" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover;">
                <button onclick="removeImage()" style="background:none; border:none; color:red; cursor:pointer;">✖</button>
            </div>
        </div>

        <!-- Profile Description Input -->
        <label for="userDesc" class="register-label" style="padding-top: 1rem;">Description</label>
        <div class="">
            <textarea type="text" id="userDesc" rows="4" name="" placeholder="Enter description" style="resize:none"></textarea>
        </div>
        
        <!-- Modal Buttons -->
        <div class="modal-actions">
            <button type="submit" class="primary-btn">Submit Form</button>
        </div>
    </div>
    </form>
    
</div>



<!-- Script for Account Creation -->
<script src="public/js/register-script.js"></script>
<script src="public/js/theme-toggle.js"></script>

</body>
</html>
