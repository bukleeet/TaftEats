<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register-page-style.css">
</head>

<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="nav-left">
        <h2 class="logo">TaftEats</h2>
    </div>
    <div class="nav-right">
        <a href="establishments.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="reviews.html" class="nav-link">Reviews</a>
        <a href="profile-view.html" class="nav-link">Profile</a>
        <a href="login.html" class="nav-btn login">Login</a>
        <a href="register.html" class="nav-btn register">Register</a>
        <button id="themeToggle" class="theme-btn">🌙</button>
    </div>
</nav>

<main class="container register-container">
    <!-- Register Card -->
    <div class="register-card">
        <div class="register-header"> 
            <h2>Greetings!</h2>
            <p>Create an Account by entering your details.</p>
        </div>

        <!-- Registration Form -->
        <form id="registerForm">
                <!-- Username Input -->
                <div class="input-box">
                    <label for="username" class="register-label">Username</label>
                    <input type="text" id="username" class="register-input" placeholder="Enter your username" required>
                </div>

                <!-- Email Input -->
                <div class="input-box">
                    <label for="user-email" class="register-label">Email</label>
                    <input type="email" id="user-email" class="register-input" name="femail" placeholder="user@email.com" required>
                </div>

                <!-- Password Input -->
                <div class="input-box">
                    <label for="user-password" class="register-label">Password</label>
                    <input type="password" id="user-password" class="register-input" name="fpassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="sign-up-btn">Sign up</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>
</main>

<!-- Script for Account Creation -->
<script src="js/register-script.js"></script>
<script src="js/theme-toggle.js"></script>

</body>
</html>
