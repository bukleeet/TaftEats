<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register-page-style.css">
</head>

<body>
    <!-- Register Account -->
    <div class="register">

        <form action="" class="register-form">
            <h1 class="register-title">Sign up</h1>

            <!-- Registration Form -->
            <div class="register-inputs">
                <!-- Username Input -->
                <div class="input-box">
                    <input type="text" name="fusername" placeholder="" class="register-input" required>
                    <label class="register-label">Username</label>
                </div>

                <!-- Email Input -->
                <div class="input-box">
                    <input type="text" name="femail" placeholder="" class="register-input" required>
                    <label class="register-label">Email</label>
                </div>

                <!-- Password Input -->
                <div class="input-box">
                    <input type="text" name="fpassword" placeholder="" class="register-input" required>
                    <label class="register-label">Password</label>
                </div>
            </div>

            <button type="submit" class="register-button">Sign up</button>
        </form>
    </div>

</body>
</html>
