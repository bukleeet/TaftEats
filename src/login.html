<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TaftEats</title>
  <link rel="stylesheet" href="public/css/style.css" />

</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <h2 class="logo">TaftEats</h2>
  </div>
  <div class="nav-right">
    <a href="views/establishments.ejs" class="nav-link">Home</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="views/reviews.ejs" class="nav-link">Reviews</a>
    <a href="profile-view.html" class="nav-link">Profile</a>
    <a href="login.html" class="nav-btn login">Login</a>
    <a href="register.html" class="nav-btn register">Register</a>
    <button id="themeToggle" class="theme-btn">🌙</button>
  </div>
</nav>

<main class="container login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Please enter your details to sign in.</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <div class="remember-me">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Remember me for 3 weeks</label>
      </div>

      <button type="submit" class="login-submit-btn">Sign In</button>
    </form>

    <div class="register-link">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>
</main>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const remember = document.getElementById('rememberMe').checked;

    // Login Verification Logic
    if(user === 'tafteats' && pass === 'admin') {

    // Store login state in localStorage
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('currentUser', user);
      localStorage.setItem('userEmail', 'tafteats2026@email.com');
      localStorage.setItem('userProfile', 'images/tafteats.png');
      localStorage.setItem('userDesc', 'We are TaftEats. The Admin Account of this Website!');

      // Use local or session storage based on checkbox
      const storage = remember ? localStorage : sessionStorage;

      storage.setItem('isLoggedIn', 'true');
      storage.setItem('currentUser', user);

      alert('Login Successful!');
      window.location.href = 'reviews.html';
    } else {
      alert('Invalid username or password.');
    }
  });
</script>

<script src="public/js/loggedUser-script.js"></script>
<script src="public/js/theme-toggle.js"></script>
</body>
</html>
