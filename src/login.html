<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TaftEats</title>
  <link rel="stylesheet" href="css/style.css" />
  
  <style>
    /* Keep your existing internal styles for login page here */
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 1rem; }
    .login-card { background: white; width: 100%; max-width: 400px; padding: 2.5rem; border-radius: 20px; border: 1.5px solid #d1fae5; box-shadow: 0 12px 30px rgba(6, 95, 70, 0.08); text-align: center; }
    .login-header h2 { color: #065f46; font-size: 1.8rem; margin-bottom: 0.5rem; }
    .login-header p { color: #6b7280; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.2rem; text-align: left; }
    .form-group label { display: block; color: #065f46; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
    .form-input { width: 100%; padding: 0.8rem 1rem; border: 1px solid #d1fae5; border-radius: 10px; font-size: 1rem; transition: all 0.2s; }
    .form-input:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1); }
    .login-submit-btn { width: 100%; padding: 0.8rem; background-color: #065f46; color: white; border: none; border-radius: 999px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 1rem; transition: background-color 0.2s; }
    .login-submit-btn:hover { background-color: #16a34a; }
    .register-link { margin-top: 1.5rem; font-size: 0.9rem; color: #374151; }
    .register-link a { color: #16a34a; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <h2 class="logo">TaftEats</h2>
  </div>
  <div class="nav-right">
    <a href="establishments.html" class="nav-link">Home</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="reviews.html" class="nav-link">Reviews</a>
    <a href="profile-view.html" class="nav-link">Profile</a>
    <a href="login.html" class="nav-btn login">Login</a>
    <a href="register.html" class="nav-btn register">Register</a>
  </div>
</nav>

<main class="container login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Please enter your details to sign in.</p>
    </div>

    <form id="loginForm"> 
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-submit-btn">Sign In</button>
    </form>

    <div class="register-link">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
  </div>
</main>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;

    // Login Verification Logic
    if(user === 'tafteats' && pass === 'admin') {
      // Store login state in localStorage
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('currentUser', user);
      
      alert('Login Successful!');
      window.location.href = 'reviews.html'; // Redirect to reviews
    } else {
      alert('Invalid username or password.');
    }
  });
</script>

</body>
</html>
